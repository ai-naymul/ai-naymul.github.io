<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }}: {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.classList.add('js');
  })();
</script>

<link rel="preload" href="{{ '/assets/fonts/inter-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: Inter; /* taste-skill-ignore: the face his own site uses, by request */
    src: url('{{ "/assets/fonts/inter-latin.woff2" | relative_url }}') format('woff2');
    font-weight: 400 700;
    font-display: swap;
    font-style: normal;
  }
</style>
<link rel="stylesheet" href="{{ '/assets/tokens.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
