- title: "Register Shifts Break LLM Safety: A Bengali Benchmark with Culturally Grounded Harms"
  authors: "Naymul Islam, Nusrat Jahan Lia, Shubhashis Roy Dipta, Sabik Bin Sultan, Abdullah Khan Zehady"
  me: "Naymul Islam"
  note: "First three authors contributed equally."
  venue: "Published in Findings of EMNLP 2026"
  badge: true
  year: 2026
  finding: >-
    <b>879 harmful requests</b> written natively in Bengali rather than translated, sorted into
    <b>17 harm categories anchored in Bangladeshi law</b>, and asked five ways. Across
    <b>18 models</b> and <b>15,822 judged responses</b>, the same request written as newspaper
    prose is answered <b>17.5 points more often</b> than written as a casual message, in 17 of
    the 18.
  figure:
    src: "/assets/figures/register-effect.webp"
    w: 1280
    h: 684
    alt: "Bar chart of attack success rate in five prompting conditions. Bengali journalism is highest at 63.3 per cent, 17.5 points above Banglish peer-help at 45.8 per cent."
    cap: "The same harmful request, written five ways. Figure from the paper."
  schema:
    url: "https://aclanthology.org/2026.findings-emnlp.1403/"
    sameAs: "https://arxiv.org/abs/2608.22335"
    booktitle: "Findings of the Association for Computational Linguistics: EMNLP 2026"
    datePublished: "2026-10"
    doi: "10.18653/2026.findings-emnlp.1403"
    pages: "29904-29923"
    publisher: "Association for Computational Linguistics"
    authors: ["Naymul Islam", "Nusrat Jahan Lia", "Shubhashis Roy Dipta", "Sabik Bin Sultan", "Abdullah Khan Zehady"]
  links:
    - { label: "Paper", url: "https://aclanthology.org/2026.findings-emnlp.1403/" }
    - { label: "arXiv", url: "https://arxiv.org/abs/2608.22335" }
    - { label: "Project", url: "https://banglallm.github.io/banglasafe/" }
    - { label: "Data", url: "https://huggingface.co/datasets/BanglaLLM/banglasafe" }
    - { label: "Leaderboard", url: "https://banglallm.github.io/banglasafe/leaderboard.html" }
    - { label: "Code", url: "https://github.com/BanglaLLM/banglasafe" }
    - { label: "Package", url: "https://pypi.org/project/banglasafe/" }

- title: "BanglaLlama: LLaMA for Bangla Language"
  authors: "Abdullah Khan Zehady, Shubhashis Roy Dipta, Naymul Islam, Safi Al Mamun, Santu Karmaker"
  me: "Naymul Islam"
  venue: "Published in the LoResLM 2026 workshop at EACL 2026"
  year: 2026
  finding: >-
    Bangla has around <b>240 million native speakers</b> and is still treated as low-resource.
    The paper releases <b>224,000 translated Bangla instruction examples</b>, Bangla-Orca (172k)
    and Bangla-Alpaca (52k), and BanglaLlama, an open family of <b>five base and instruct
    models</b> trained on them.
  schema:
    url: "https://aclanthology.org/2026.loreslm-1.7/"
    booktitle: "Proceedings of the Second Workshop on Language Models for Low-Resource Languages (LoResLM 2026)"
    datePublished: "2026-03"
    publisher: "Association for Computational Linguistics"
    authors: ["Abdullah Khan Zehady", "Shubhashis Roy Dipta", "Naymul Islam", "Safi Al Mamun", "Santu Karmaker"]
  links:
    - { label: "Paper", url: "https://aclanthology.org/2026.loreslm-1.7/" }

- title: "Read Between the Lines: A Benchmark for Uncovering Political Bias in Bangla News Articles"
  authors: "Nusrat Jahan Lia, Shubhashis Roy Dipta, Abdullah Khan Zehady, Naymul Islam, Madhusodan Chakraborty, Abdullah Al Wasif"
  me: "Naymul Islam"
  venue: "Published in the BLP workshop at IJCNLP-AACL 2025"
  year: 2025
  finding: >-
    The first benchmark of <b>200 politically contested Bangla news articles</b>, each labelled
    government-leaning, government-critique or neutral by three annotators. Across
    <b>28 proprietary and open models</b>, F1 reaches <b>0.83</b> on government-critique but falls
    as low as <b>0.00</b> on neutral, and models over-predict government-leaning stances.
  figure:
    src: "/assets/figures/bangla-bias-f1.webp"
    w: 1400
    h: 847
    alt: "F1 score per label across 28 models grouped by size. Government-critique reaches 0.43 to 0.79, neutral only 0.17 to 0.60, government-leaning 0.33 to 0.64."
    cap: "F1 by stance across model sizes. Neutral is the hard class. Figure from the paper."
  schema:
    url: "https://aclanthology.org/2025.banglalp-1.5/"
    sameAs: "https://arxiv.org/abs/2510.03898"
    booktitle: "Proceedings of the Second Workshop on Bangla Language Processing (BLP-2025)"
    datePublished: "2025-12"
    publisher: "Association for Computational Linguistics"
    authors: ["Nusrat Jahan Lia", "Shubhashis Roy Dipta", "Abdullah Khan Zehady", "Naymul Islam", "Madhusodan Chakraborty", "Abdullah Al Wasif"]
  links:
    - { label: "Paper", url: "https://aclanthology.org/2025.banglalp-1.5/" }
    - { label: "Project", url: "https://nusrat-lia.github.io/BanglaBias/" }
