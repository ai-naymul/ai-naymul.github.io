- org: "Perspectivity"
  logo: { src: "/assets/logos/perspectivity.webp", w: 98, h: 64 }
  url: "https://perspectivity.co"
  also: [{ label: "app.perspectivity.co", url: "https://app.perspectivity.co" }, { label: "drishtikon.life", url: "https://drishtikon.life" }]
  role: "Founding member and lead engineer"
  when: "2024 to present"
  what: >-
    An AI-native narrative intelligence platform: it puts many outlets' coverage of one story side
    by side, marks where each leans, and lets a reader question it. I own the backend and the
    infrastructure. I originated the link resolver, the pipeline orchestrator and the whole
    Kubernetes deployment layer, and I run the production cluster, which is a single $98 VPS.
    The pipeline ingests thousands of source articles a day and has taken in more than 400,000,
    and the cluster serves about 58,000 HTTP requests a day to roughly 3,500 distinct client IPs
    at a 0.10 per cent 5xx rate, on a three-node MongoDB replica set. Every analysed event comes
    out as an 11-section structured object covering source credibility, claim-level fact-checking
    with three-tier evidence grading, framing bias and context omissions, with controls that
    require an "Unverified" verdict rather than a guessed one, plus an 11-bucket political
    taxonomy and a 300-constituency election map. On top of it sits a human-in-the-loop content
    pipeline with rate caps, an audit trail and auto-publishing to several platforms on nine
    production cron schedules. It reaches 106,000 YouTube subscribers and 787,000 lifetime video
    views, 186,000 web users over thirteen months with a 55,000 peak month, and readers in 26
    countries. Live on the web, with iOS and Android in beta.

- org: "Fellou AI (ASI X Inc.)"
  url: "https://fellou.ai/"
  logo: { src: "/assets/logos/fellou.webp", w: 64, h: 64 }
  role: "Research and development engineer"
  when: "Aug 2025 to Jan 2026"
  what: >-
    Sole author of three systems for an agentic browser. The first is a generative-UI proof of
    concept: the model emits a validated UI specification that renders into a live, interactive
    interface rather than a chat reply. Across them, 13 backend services, 4 route groups and 23
    custom React components, with typed contracts across the boundary. The second runs the desktop browser on a provisioned cloud
    machine and streams it into a web page, with session lifecycle and authentication
    fallback. Work under confidentiality; described here at the level that allows.

- org: "AIMarketCap"
  logo: { src: "/assets/logos/aimarketcap.webp", w: 64, h: 64 }
  role: "Technical lead"
  when: "2025 to 2026"
  what: >-
    Backend lead on a seven-person team, leading four people and reporting to the CEO, across the
    data platform, how far it scales, the analytics on top of it, and the interface and product
    design. About 15 external data sources across crypto, equities, AI-tool directories, startup
    lists, social signals and web traffic. A time-series engine computing rolling metrics across
    11 timeframes, from 15 minutes to yearly, for roughly 20,000 coins, behind a market-bubble
    interface. A corpus of about 75,000 AI-tool and product records, aggregated through a
    six-month campaign against bot detection using undetected browser drivers, CDP mode and proxy
    rotation. A schema-embedding retrieval system that infers the database schema, embeds each
    collection into a Milvus vector index, searches it per question, generates an aggregation
    pipeline and phrases the answer, with three pluggable embedding providers and both Milvus and
    pgvector behind it. And the platform it all runs on: a self-managed kubeadm cluster with a
    private registry, 238 Kubernetes manifests and 18 Dockerfiles, including 23 network policies,
    18 stateful sets, 12 pod disruption budgets and 9 Prometheus service monitors, with Airflow
    orchestrating the crypto, stock, AI-tool and web-traffic pipelines.

