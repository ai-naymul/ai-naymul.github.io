- org: "Perspectivity"
  logo: { src: "/assets/logos/perspectivity.webp", w: 98, h: 64 }
  url: "https://perspectivity.co"
  also: [{ label: "app.perspectivity.co", url: "https://app.perspectivity.co" }, { label: "drishtikon.life", url: "https://drishtikon.life" }]
  role: "Founding member and lead engineer"
  when: "2024 to present"
  what: |-
    <p>A platform that puts many outlets' coverage of one story side by side, marks where each one
    leans, and lets a reader question it. I own the backend and the infrastructure. The link resolver,
    the pipeline orchestrator and the Kubernetes deployment layer all started with me, and I run the
    production cluster. It is <b>a single $98 VPS</b>.</p>
    <p>The pipeline takes in thousands of articles a day and has ingested <b>more than 400,000</b>. The
    cluster serves <b>about 58,000 HTTP requests a day</b> to roughly <b>3,500 distinct client IPs</b>,
    at a 0.10 per cent 5xx rate, on a three-node MongoDB replica set.</p>
    <p>Every analysed event comes out as an <b>11-section structured object</b>: source credibility,
    claim-level fact-checking with three-tier evidence grading, framing bias, context omissions. Where
    the evidence is missing the schema forces an "Unverified" verdict instead of a guess. There is also
    an 11-bucket political taxonomy and a <b>300-constituency election map</b>.</p>
    <p>Above that sits a human-in-the-loop content pipeline with rate caps, an audit trail and
    auto-publishing to several platforms, on nine production cron schedules.</p>
    <p>It reaches <b>106,000 YouTube subscribers</b> and 787,000 lifetime video views, and
    <b>186,000 web users</b> over thirteen months, peaking at 55,000 in a single month, with readers in
    <b>26 countries</b>. Live on the web, with iOS and Android in beta.</p>

- org: "Fellou AI (ASI X Inc.)"
  url: "https://fellou.ai/"
  logo: { src: "/assets/logos/fellou.webp", w: 64, h: 64 }
  role: "Research and development engineer"
  when: "Aug 2025 to Jan 2026"
  what: |-
    <p>Sole author of three systems for an agentic browser. The first is a generative-UI proof of
    concept: the model emits a validated UI specification that renders into a live, interactive
    interface instead of a chat reply. The second runs the desktop browser on a provisioned cloud
    machine and streams it into a web page, with session lifecycle and authentication fallback.</p>
    <p>Across them, <b>13 backend services</b>, 4 route groups and <b>23 custom React components</b>,
    with typed contracts across the boundary. Work under confidentiality; described here at the level
    that allows.</p>

- org: "AIMarketCap"
  logo: { src: "/assets/logos/aimarketcap.webp", w: 64, h: 64 }
  role: "Technical lead"
  when: "2025 to 2026"
  what: |-
    <p>Backend lead on a <b>seven-person team</b>, leading four people and reporting to the CEO. The
    work covered the data platform, how far it scales, the analytics on top of it, and the interface
    and product design.</p>
    <p>About <b>15 external data sources</b> feed it: crypto, equities, AI-tool directories, startup
    lists, social signals, web traffic. The time-series engine computes rolling metrics across
    <b>11 timeframes</b>, from 15 minutes to yearly, for roughly <b>20,000 coins</b>, behind a
    market-bubble interface.</p>
    <p>The AI-tool corpus runs to <b>about 75,000 records</b>. Collecting it took a six-month campaign
    against bot detection, with undetected browser drivers, CDP mode and rotating proxies.</p>
    <p>I also built a schema-embedding retrieval system. It reads the database schema, embeds each
    collection into a Milvus vector index, searches that index per question, writes an aggregation
    pipeline and phrases the answer. Three embedding providers are pluggable, with Milvus and pgvector
    behind it.</p>
    <p>All of it runs on a self-managed kubeadm cluster with a private registry:
    <b>238 Kubernetes manifests</b> and 18 Dockerfiles, including 23 network policies, 18 stateful
    sets, 12 pod disruption budgets and 9 Prometheus service monitors, with Airflow orchestrating the
    crypto, stock, AI-tool and web-traffic pipelines.</p>

