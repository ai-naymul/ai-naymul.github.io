- org: "Freedoms.ai"
  url: "https://freedoms.ai/"
  logo: { src: "/assets/logos/freedoms.webp", w: 31, h: 64 }
  role: "Engineer"
  when: "2024 to 2025"
  what: >-
    Built the whole backend for an AI notes and journaling product: retrieval over the user's own
    notes with LightRAG and Language Agent Tree Search, and self-hosted speech-to-text and
    text-to-speech infrastructure tuned to the platform rather than called from a managed API. I
    developed and evaluated several open-source speech models to choose between them, at a time
    when there was very little evaluation work for speech.

- org: "Menlo Park Lab"
  url: "https://menloparklab.com/"
  logo: { src: "/assets/logos/menlopark.svg", w: 32, h: 32 }
