- org: "Perspectivity"
  logo: { src: "/assets/logos/perspectivity.webp", w: 98, h: 64 }
  url: "https://perspectivity.co"
  also: [{ label: "app.perspectivity.co", url: "https://app.perspectivity.co" }, { label: "drishtikon.life", url: "https://drishtikon.life" }]
  role: "Founding member and lead engineer"
  when: "2024 to present"
  what: >-
    An AI-native narrative intelligence platform: it puts many outlets' coverage of one story side
    by side, marks where each leans, and lets a reader question it. I originated the link resolver,
    the pipeline orchestrator and the whole Kubernetes deployment layer, and I run the production
    cluster. The pipeline has ingested 418,591 source articles. Every analysed event comes out as
    an 11-section structured object covering source credibility, claim-level fact-checking with
    three-tier evidence grading, framing bias and context omissions, with controls that require an
    "Unverified" verdict rather than a guessed one. It also carries an 11-bucket political taxonomy
    and a 300-constituency election map. The cluster serves about 58,000 HTTP requests a day to
    roughly 3,500 distinct client IPs at a 0.10 per cent 5xx rate, on a three-node MongoDB replica
    set. Live on the web, with iOS and Android in beta.

- org: "Fellou AI (ASI X Inc.)"
  url: "https://fellou.ai/"
  logo: { src: "/assets/logos/fellou.webp", w: 64, h: 64 }
  role: "Research and development engineer"
  when: "Aug 2025 to Jan 2026"
  what: >-
    Sole author of three systems for an agentic browser. The first is a generative-UI proof of
    concept: the model emits a validated UI specification that renders into a live, interactive
    interface rather than a chat reply. Across them, 13 backend services, 4 route groups and 23
    custom React components, with typed contracts across the boundary. The second runs the desktop browser on a provisioned cloud
    machine and streams it into a web page, with session lifecycle and authentication
    fallback. Work under confidentiality; described here at the level that allows.

- org: "AIMarketCap"
  logo: { src: "/assets/logos/aimarketcap.webp", w: 64, h: 64 }
  role: "Technical lead"
  when: "2025 to 2026"
  what: >-
    Backend lead on a seven-person team, reporting to the CEO, and I lead the technical
    development: the data platform and how far it scales, the analytics on top of it, and the
    interface and product design. I integrated about 15 external data sources across crypto,
    equities, AI-tool directories, startup lists, social signals and web traffic, built a
    retrieval-augmented semantic search over the aggregated corpus, and built the deployment
    layer, 238 Kubernetes manifests and 18 Dockerfiles including RBAC, network policies and
    Prometheus monitoring, on a self-hosted cluster.

