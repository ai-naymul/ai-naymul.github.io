- org: "Perspectivity"
  logo: { src: "/assets/logos/perspectivity.webp", w: 98, h: 64 }
  url: "https://perspectivity.co"
  role: "Founding member and lead engineer"
  when: "2024 to present"
  what: >-
    An AI-native narrative intelligence platform. It puts fifty or more outlets' coverage of the
    same story side by side, marks where each one leans, and lets a reader question it. I built the
    ingestion and event-clustering pipeline that groups coverage of the same story across
    outlets, the link resolver it depends on, the orchestration layer around it, and the
    Kubernetes deployment. I run the production cluster.

