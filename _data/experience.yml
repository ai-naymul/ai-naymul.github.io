- org: "Freedoms.ai"
  url: "https://freedoms.ai/"
  logo: { src: "/assets/logos/freedoms.webp", w: 31, h: 64 }
  role: "Engineer"
  when: "2024 to 2025"
  what: |-
    <p>Built the whole backend for an AI notes and journaling product. Retrieval runs over the user's
    own notes with <b>LightRAG</b> and <b>Language Agent Tree Search</b>. Speech is <b>self-hosted in
    both directions</b>, tuned to the platform rather than called from a managed API. I developed and
    evaluated several open-source speech models to choose between them, at a time when there was very
    little evaluation work for speech.</p>

- org: "Menlo Park Lab"
  url: "https://menloparklab.com/"
  logo: { src: "/assets/logos/menlopark.svg", w: 32, h: 32 }
  role: "ML research and open-source intern"
  when: "Feb to Jul 2024"
  what: |-
    <p>Sole engineer on an <b>autonomous coding agent</b> built with LangChain and LangGraph. It
    planned its own steps, wrote and tested code, and ran shell commands, closing the loop without a
    person driving each step. The founder adopted it internally.</p>

- org: "BanglaLLM"
  url: "https://banglallm.github.io/"
